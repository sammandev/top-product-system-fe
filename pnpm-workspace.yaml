allowBuilds:
  '@parcel/watcher': false
  core-js: false
  esbuild: false
  msw: false
  pnpm: true
  vue-demi: true

minimumReleaseAgeExclude:
  - happy-dom@21.0.4
  - vue-echarts@8.2.0

overrides:
  'exceljs>uuid': ^11.1.1
  glob: ^14.0.2
  minimatch: ^11.0.1
  dompurify: '>=3.4.17'
  brace-expansion: '>=5.0.12'
  source-map-js: '>=1.2.2'
  follow-redirects: '>=1.16.1'
